name: fumi checks
# 文書だけの変更では実行しない。tests/fixtures の .md はテスト入力なので除外しない
on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 通常は4分以内。検証が止まったときに既定の6時間まで動かさない
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # macosのランナーにはtmuxが入っておらず、pty_tmux.pyが実行されない
      - name: tmuxを導入
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: ツールのバージョンを記録
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          tmux -V
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: python3 tests/pty_smoke.py target/debug/fumi
      - run: python3 tests/pty_v1.py target/debug/fumi
      - run: python3 tests/pty_tmux.py target/debug/fumi
      - run: python3 tests/pty_v2.py target/debug/fumi
  # Cargo.tomlのrust-versionと合わせる。fmt・Clippyは版で結果が変わるためstableだけで行う
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - run: rustc --version
      - run: cargo test --locked --all-targets --all-features
