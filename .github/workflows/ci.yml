name: fumi checks
# 文書だけの変更では実行しない。tests/fixtures の .md はテスト入力なので除外しない
on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - "licenses/**"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustのバージョンを記録
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: python3 tests/pty_smoke.py target/debug/fumi
      - run: python3 tests/pty_v1.py target/debug/fumi
      - run: python3 tests/pty_tmux.py target/debug/fumi
