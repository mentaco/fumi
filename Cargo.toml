[package]
name = "mdview"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "読み取り専用のMarkdownターミナルビューア"
license = "MIT"

[features]
startup-profile = []

[dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
crossterm = "=0.28.1"
libc = "0.2"
pulldown-cmark = "=0.13.0"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
signal-hook = "0.3"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-render = { version = "=0.1.15", features = ["embed-fonts"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.17.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
