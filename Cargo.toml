[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "読み取り専用のMarkdownターミナルビューア"

[dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
crossterm = "=0.28.1"
libc = "0.2"
pulldown-cmark = "=0.13.0"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
signal-hook = "0.3"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
